<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org"
	th:replace="~{base::Layout(~{::section})}">
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
</head>
<body>
	<section>

		<div class="container mt-5 p-5">
			<div class="row">

				<div class="col-md-5 p-2 d-flex align-items-center me-auto"
					style="margin-left: -100px;">
					<img alt="" src="img/ecom.png" width="100%" height="300px">
				</div>
				<div class="col-md-6 mt-2 p-5">
					<div class="card shadow">
						<div class="card-header">
							<p class="fs-4 text-center">Забыли пароль?</p>
							
							<th:block th:if="${session.succMsg}">
								<p class="text-success fw-bold text-center">[[${session.succMsg}]]</p>
								<th:block th:text="${@commonServiceImpl.removeSessionMessage()}"></th:block>

							</th:block>

							<th:block th:if="${session.errorMsg}">
								<p class="text-danger fw-bold text-center">[[${session.errorMsg}]]</p>
								<th:block th:text="${@commonServiceImpl.removeSessionMessage()}"></th:block>
							</th:block>	
								
						</div>
						<div class="card-body">
							<form action="/forgot-password" method="post">
								<div class="mb-3">
									<label class="form-label">Email</label> <input
										class="form-control" name="email" type="email" placeholder="Введите свой Email">
								</div>

	
								<button type="submit"
									class="btn bg-primary text-white col-md-12">Отправить</button>
							</form>
						</div>
					</div>
				</div>
			</div>
		</div>

	</section>
</body>
</html>
