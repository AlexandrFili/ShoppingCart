<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org"
	th:replace="~{base::Layout(~{::section})}">
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
</head>
<body>
	<section>
		<div class="container-fluid bg-primary p-5 mt-5">
			<div class="row">
				<div class="col-md-8 offset-md-2">
					<form>
						<div class="input-group">
							<input type="text" class="form-control" name="ch">
							<button class="btn btn-light text-dark ms-3 col-md-2">
								<i class="fa-solid fa-magnifying-glass"></i> Поиск
							</button>
						</div>
					</form>
				</div>
			</div>
		</div>

		<div class="container-fluid mt-1">
			<div class="row">

				<div class="col-md-2">

					<div class="card shadow p-0 mb-5 bg-body-tertiary rounded">
						<div class="card-body">
							<div class="list-group">
								<p class="fs-5">Категории</p>
								<a href="/products"
									th:classappend="${paramValue==''} ? 'active':''"
									class="list-group-item list-group-item-action"
									aria-current="true">Все</a> <a th:each="c:${categories}"
									th:href="@{'/products?category='+${c.name}}"
									th:classappend="${paramValue == c.name} ? 'active':''"
									class="list-group-item list-group-item-action">[[${c.name}]]</a>

							</div>
						</div>
					</div>
				</div>
				<div class="col-md-10">
					<div class="card shadow p-0 mb-5 bg-body-tertiary rounded">
						<div class="card-body">
							<p class="fs-3 text-center">
								<span th:if="${paramValue == null or paramValue == ''}">Все
									товары</span> <span th:if="${paramValue != null and paramValue != ''}">[[${paramValue}]]</span>
							</p>
							<div class="row">

								<th:block th:if="${products.size > 0}">



									<div class="col-md-3" th:each="p:${products}">
										<div class="card shadow p-0 mb-5 bg-body-tertiary rounded">
											<div class="card-body">
												<img alt="" th:src="@{'/uploads/product_img/'+${p.image}}"
													width="100%" height="200px">
												<p class="fs-5 text-center">[[${p.title}]]</p>
												<div class="row text-center">
													<p class="fs-6 fw-bold">
														<span>[[${p.discountPrice}]] &#8381;</span> <br> <span
															class="text-decoration-line-through text-secondary">
															[[${p.price}]] &#8381; </span> <span class="fs-6 text-success">скидка
															[[${p.discount}]]% </span>
													</p>
													<a th:href="@{'/product/'+${p.id}}"
														class="btn btn-primary col-md-6 offset-md-3">Просмотр</a>
												</div>
											</div>
										</div>
									</div>

								</th:block>
								<th:block th:unless="${products.size > 0}">
									<p class="fs-4 text-center mt-4 text-secondary">Товаров нет
										в наличии</p>
								</th:block>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>
	</section>
</body>
</html>
