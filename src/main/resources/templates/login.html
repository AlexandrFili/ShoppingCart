g<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org"
	th:replace="~{base::Layout(~{::section})}">
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
</head>
<body>
	<section>

		<div class="container mt-5 p-5">
			<div class="row">

				<div class="col-md-5 p-2 d-flex align-items-center me-auto"
					style="margin-left: -100px;">
					<img alt="" src="img/ecom.png" width="100%" height="300px">
				</div>
				<div class="col-md-6 mt-2 p-5">
					<div class="card shadow">
						<div class="card-header">
							<p class="fs-4 text-center">Вход</p>
							
							<div th:if="${param.error}" class="alert alert-danger text-center"> 
							[[${session.SPRING_SECURITY_LAST_EXCEPTION.message}]]</div>
							
							<div th:if="${param.logout}" class="alert alert-success">Выход успешно произведен!</div>
							
						</div>
						<div class="card-body">
							<form action="/login" method="post">
								<div class="mb-3">
									<label class="form-label">Email</label> <input
										class="form-control" name="username" type="email">
								</div>

								<div class="mb-3">
									<label class="form-label">Пароль</label> <input
										class="form-control" name="password" type="password">
								</div>
								<button type="submit"
									class="btn bg-primary text-white col-md-12">Войти</button>
							</form>
						</div>

						<div class="card-footer text-center">
							<a href="#" class="text-decoration-none">Забыли пароль?</a><br>
							Нет аккаунта? <a href="#" class="text-decoration-none">Создать
								аккаунт</a>
						</div>

					</div>
				</div>
			</div>
		</div>

	</section>
</body>
</html>
