<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org"
	th:replace="~{base::Layout(~{::section})}">
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
</head>
<body>
	<section>
		<div class="container-fluid p-5 mt-5">
			<div class="row">
				<div class="col-md-3">
					<div class="card card-sh">
						<div class="card-header text-center">
							<p class="fs-4">Добавление категории</p>
							<th:block th:if="${session.succMsg}">
								<p class="text-success fw-bold">[[${session.succMsg}]]</p>
								<th:block th:text="${@commonServiceImpl.removeSessionMessage()}"></th:block>
								
							</th:block>

							<th:block th:if="${session.errorMsg}">
								<p class="text-danger fw-bold">[[${session.errorMsg}]]</p>
								<th:block th:text="${@commonServiceImpl.removeSessionMessage()}"></th:block>
							</th:block>

						</div>
						<div class="card-body">
							<form action="/admin/saveCategory" method="post"
								enctype="multipart/form-data">
								<div class="mb-3">
									<label>Ввести категорию</label> <input type="text" name="name"
										class="form-control">
								</div>

								<div class="mb-3">
									<label>Статус</label>

									<div class="form-check">
										<input class="form-check-input" type="radio" checked
											value="true" name="isActive" id="active"> <label
											class="form-check-label" for="radioDefault1"> Активно</label>
									</div>
									<div class="form-check">
										<input class="form-check-input" type="radio" name="isActive"
											value="false" id="radioDefault2"> <label
											class="form-check-label" for="radioDefault2"> Не
											активно</label>
									</div>

								</div>

								<div class="mb-3">
									<label>Загрузить изображение</label> <input type="file"
										name="file" class="form-control">
								</div>
								<button class="btn btn-primary col-md-12 mt-2">
									Сохранить</button>

							</form>
						</div>
					</div>
				</div>

				<div class="col-md-8">
					<div class="card card-sh">
						<div class="card-header text-center fs-4">Просмотр категорий</div>
						<div class="card-body">
							<table class="table">
								<thead>
									<tr>
										<th scope="col">№</th>
										<th scope="col">Категория</th>
										<th scope="col">Изображение</th>
										<th scope="col">Действие</th>
									</tr>
								</thead>
								<tbody>
									<tr>
										<th scope="row">1</th>
										<td>Mark</td>
										<td>Otto</td>
										<td>@mdo</td>
									</tr>

								</tbody>
							</table>
						</div>

					</div>

				</div>
			</div>
		</div>
	</section>
</body>
</html>
