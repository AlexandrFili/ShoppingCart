<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org"
	th:replace="~{base::Layout(~{::section})}">
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
</head>
<body>
	<section>
		<div class="container-fluid p-5 mt-5">
			<div class="row">
				<div class="col-md-3">
					<div class="card card-sh">
						<div class="card-header text-center fs-4">Добавление
							категории</div>
						<div class="card-body">
							<form>
								<div class="mb-3">
									<label>Ввести категорию</label> <input type="text"
										class="form-control">
								</div>

								<div class="mb-3">
									<label>Загрузить изображение</label> <input type="file"
										class="form-control">
								</div>
							</form>
						</div>
					</div>
				</div>

				<div class="col-md-8">
					<div class="card card-sh">
					<div class="card-header text-center fs-4">Просмотр категорий</div>
						<div class="card-body">
							<table class="table">
								<thead>
									<tr>
									<th scope="col">№</th>
										<th scope="col">Категория</th>
										<th scope="col">Изображение</th>
										<th scope="col">Действие</th>
									</tr>
								</thead>
								<tbody>
									<tr>
										<th scope="row">1</th>
										<td>Mark</td>
										<td>Otto</td>
										<td>@mdo</td>
									</tr>
							
								</tbody>
							</table>
						</div>

					</div>

				</div>
			</div>
		</div>
	</section>
</body>
</html>
